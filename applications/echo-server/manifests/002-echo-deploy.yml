---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: echo
  labels:
    app.kubernetes.io/name: echo
    app.kubernetes.io/component: echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: echo
      app.kubernetes.io/component: echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echo
        app.kubernetes.io/component: echo
    spec:
      containers:
        - name: echo
          image: jmalloc/echo-server:v0.3.7
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: echo
                  key: port
          ports:
            - name: http
              containerPort: 10000
          resources:
            requests:
              cpu: 5m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 32Mi
