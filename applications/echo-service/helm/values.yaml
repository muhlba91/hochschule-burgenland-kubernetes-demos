# Default values for echo
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: hashicorp/http-echo
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

args:
  - -text=hello world

service:
  type: ClusterIP
  port: 80
  targetPort: 5678

ingress:
  enabled: false
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: cluster-issuer-muehlbachler-xyz
    external-dns.kubernetes.io/provider: public
    external-dns.kubernetes.io/target: 178.63.69.250,2a01:4f8:121:14e2:100:3:3:3
  hosts:
    - host: echo-ingress.demo.cluster.classroom.hochschule-burgenland.muehlbachler.xyz
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: echo-ingress-tls
      hosts:
        - echo-ingress.demo.cluster.classroom.hochschule-burgenland.muehlbachler.xyz

listenerSet:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: cluster-issuer-muehlbachler-xyz
    external-dns.kubernetes.io/provider: public
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: kgateway-gateway
    namespace: kgateway
  listeners:
    - name: https-echo
      protocol: HTTPS
      port: 443
      hostname: echo.demo.cluster.classroom.hochschule-burgenland.muehlbachler.xyz
      tls:
        mode: Terminate
        certificateRefs:
          - name: echo-tls
      allowedRoutes:
        namespaces:
          from: Same

httpRoute:
  enabled: true
  annotations:
    external-dns.kubernetes.io/provider: public
    external-dns.kubernetes.io/target: 178.63.69.250,2a01:4f8:121:14e2:100:3:3:2
  parentRef:
    name: echo-listener
    kind: ListenerSet
    group: gateway.networking.k8s.io
    sectionName: https-echo
  hostnames:
    - echo.demo.cluster.classroom.hochschule-burgenland.muehlbachler.xyz
  matches:
    - path:
        type: PathPrefix
        value: /

resources:
  requests:
    cpu: 5m
    memory: 12Mi
  limits:
    cpu: 100m
    memory: 32Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
