---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: echo-listener
  namespace: echo
  annotations:
    cert-manager.io/cluster-issuer: cluster-issuer-muehlbachler-xyz
    external-dns.kubernetes.io/provider: public
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: kgateway-gateway
    namespace: kgateway
  listeners:
    - name: https-echo
      protocol: HTTPS
      port: 443
      hostname: echo.demo.cluster.classroom.hochschule-burgenland.muehlbachler.xyz
      tls:
        mode: Terminate
        certificateRefs:
          - name: echo-tls
      allowedRoutes:
        namespaces:
          from: Same
