{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "..fullname" . }}
  labels:
    {{- include "..labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.parentRef.name | default (printf "%s-listener" (include "..fullname" .)) }}
      kind: {{ .Values.httpRoute.parentRef.kind | default "ListenerSet" }}
      group: {{ .Values.httpRoute.parentRef.group | default "gateway.networking.k8s.io" }}
      {{- if .Values.httpRoute.parentRef.sectionName }}
      sectionName: {{ .Values.httpRoute.parentRef.sectionName }}
      {{- end }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        {{- toYaml .Values.httpRoute.matches | nindent 8 }}
      backendRefs:
        - name: {{ include "..fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
